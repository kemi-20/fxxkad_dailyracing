name: Build Integrated RacingDaily APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lspatch-integrated.yml"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "origin/racingdaily.apk"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_TOOLS_VERSION: "36.0.0"
  NPATCH_VERSION: "v1.0.1"
  NPATCH_JAR_NAME: "jar-v1.0.1-577-release.jar"
  ORIGINAL_APK: "origin/racingdaily.apk"

jobs:
  build-integrated:
    name: Build integrated NPatch APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-33" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify original APK exists
        run: |
          test -f "${ORIGINAL_APK}"
          ls -lh "${ORIGINAL_APK}"

      - name: Build Xposed module
        run: gradle assembleRelease --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p build/signing
          printf "%s" "${KEYSTORE_BASE64}" | base64 --decode > build/signing/release.keystore

      - name: Sign Xposed module APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED_MODULE="$(find app/build/outputs/apk/release -maxdepth 1 -name "*release*.apk" | head -n 1)"
          test -n "${UNSIGNED_MODULE}"
          mkdir -p build/module
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign" -p -f 4 "${UNSIGNED_MODULE}" build/module/module-aligned.apk
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
            --ks build/signing/release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out build/module/xposed-module-signed.apk \
            build/module/module-aligned.apk
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose build/module/xposed-module-signed.apk

      - name: Download NPatch and apktool
        run: |
          mkdir -p tools
          curl -L --fail \
            -o tools/npatch.jar \
            "https://github.com/7723mod/NPatch/releases/download/${NPATCH_VERSION}/${NPATCH_JAR_NAME}"
          curl -L --fail \
            -o tools/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar"

      - name: Inject module with NPatch integrated mode
        run: |
          set -euo pipefail
          mkdir -p build/npatch-output
          java -jar tools/npatch.jar \
            "${ORIGINAL_APK}" \
            -m build/module/xposed-module-signed.apk \
            -o build/npatch-output \
            -l 2 \
            -v
          PATCHED_APK="$(find build/npatch-output -type f -name "*.apk" | head -n 1)"
          test -n "${PATCHED_APK}"
          cp "${PATCHED_APK}" build/racingdaily-npatched-raw.apk

      - name: Preserve original version and Android SDK metadata
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}
        run: |
          set -euo pipefail
          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2"

          read_meta_from_aapt2() {
            local apk="$1"
            local badging
            badging="$("${AAPT2}" dump badging "${apk}")"
            local package_meta min_sdk target_sdk
            package_meta="$(printf "%s\n" "${badging}" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/package=\1 versionCode=\2 versionName=\3/p")"
            min_sdk="$(printf "%s\n" "${badging}" | sed -n "s/^sdkVersion:'\([^']*\)'.*/minSdk=\1/p")"
            target_sdk="$(printf "%s\n" "${badging}" | sed -n "s/^targetSdkVersion:'\([^']*\)'.*/targetSdk=\1/p")"
            printf "%s\n%s\n%s\n" "${package_meta}" "${min_sdk}" "${target_sdk}"
          }

          # Read original APK metadata for logging and potential use
          read_meta_from_aapt2 "${ORIGINAL_APK}" > build/original.meta || true
          echo "Original APK metadata:"
          cat build/original.meta

          # Try reading NPatch output with aapt2
          if read_meta_from_aapt2 build/racingdaily-npatched-raw.apk > build/patched.meta 2>/dev/null; then
            echo "Patched APK metadata:"
            cat build/patched.meta
            if cmp -s build/original.meta build/patched.meta; then
              echo "Metadata matches, using NPatch output directly"
              cp build/racingdaily-npatched-raw.apk build/racingdaily-npatched-metadata.apk
              exit 0
            fi
            echo "Metadata differs, will try apktool fix"
          else
            echo "aapt2 cannot read NPatch output"
          fi

          # Try apktool; it uses its own parsers that may handle NPatch's zip format
          echo "Trying apktool decompile..."
          java -jar tools/apktool.jar d -f -s "${ORIGINAL_APK}" -o build/apktool-original

          if java -jar tools/apktool.jar d -f -s build/racingdaily-npatched-raw.apk -o build/apktool-patched 2>/dev/null; then
            echo "Apktool decompile succeeded, fixing metadata..."
            python3 - <<'PY'
          import re
          from pathlib import Path

          original = Path("build/apktool-original/apktool.yml").read_text(encoding="utf-8")
          patched_path = Path("build/apktool-patched/apktool.yml")
          patched = patched_path.read_text(encoding="utf-8")

          def section(text, name):
              match = re.search(rf"^{name}:\n(?:  .*\n)*", text, flags=re.MULTILINE)
              if not match:
                  raise SystemExit(f"Missing {name} in apktool.yml")
              return match.group(0)

          for name in ("versionInfo", "sdkInfo"):
              original_section = section(original, name)
              patched_match = re.search(rf"^{name}:\n(?:  .*\n)*", patched, flags=re.MULTILINE)
              if patched_match:
                  patched = patched[:patched_match.start()] + original_section + patched[patched_match.end():]
              else:
                  patched += "\n" + original_section

          patched_path.write_text(patched, encoding="utf-8")
          PY
            java -jar tools/apktool.jar b build/apktool-patched -o build/racingdaily-npatched-metadata.apk

            if read_meta_from_aapt2 build/racingdaily-npatched-metadata.apk > build/restored.meta 2>/dev/null; then
              if cmp -s build/original.meta build/restored.meta; then
                echo "Apktool metadata fix successful"
                exit 0
              fi
              echo "Warning: rebuilt APK metadata still differs, using NPatch output directly"
            else
              echo "Warning: rebuilt APK unreadable, using NPatch output directly"
            fi
          else
            echo "Apktool cannot decompile NPatch output, using NPatch output directly"
          fi

          # Fallback: use NPatch output as-is (metadata preserved internally by NPatch)
          echo "Using NPatch output directly"
          cp build/racingdaily-npatched-raw.apk build/racingdaily-npatched-metadata.apk

      - name: Sign integrated APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/final
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign" -p -f 4 \
            build/racingdaily-npatched-metadata.apk \
            build/final/racingdaily-npatched-aligned.apk
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
            --ks build/signing/release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out build/final/racingdaily-npatched.apk \
            build/final/racingdaily-npatched-aligned.apk
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose build/final/racingdaily-npatched.apk

      - name: Verify final metadata
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}
        run: |
          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2"

          read_meta() {
            local badging
            badging="$("${AAPT2}" dump badging "$1")"
            local package_meta min_sdk target_sdk
            package_meta="$(printf "%s\n" "${badging}" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/package=\1 versionCode=\2 versionName=\3/p")"
            min_sdk="$(printf "%s\n" "${badging}" | sed -n "s/^sdkVersion:'\([^']*\)'.*/minSdk=\1/p")"
            target_sdk="$(printf "%s\n" "${badging}" | sed -n "s/^targetSdkVersion:'\([^']*\)'.*/targetSdk=\1/p")"
            printf "%s\n%s\n%s\n" "${package_meta}" "${min_sdk}" "${target_sdk}"
          }

          read_meta "${ORIGINAL_APK}" > build/original-final.meta
          if read_meta build/final/racingdaily-npatched.apk > build/patched-final.meta 2>/dev/null; then
            if cmp -s build/original-final.meta build/patched-final.meta; then
              echo "Final metadata verification passed"
            else
              echo "Warning: final APK metadata differs from original"
            fi
          else
            echo "Warning: aapt2 cannot read final APK metadata, skipping comparison"
          fi

      - name: Upload integrated APK
        uses: actions/upload-artifact@v7
        with:
          name: racingdaily-npatched-integrated
          path: build/final/racingdaily-npatched.apk
