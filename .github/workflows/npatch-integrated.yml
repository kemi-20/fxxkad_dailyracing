name: Build Integrated RacingDaily APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/npatch-integrated.yml"
      - "app/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "origin/racingdaily.apk"

permissions:
  contents: read

concurrency:
  group: npatch-integrated-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_TOOLS_VERSION: "36.0.0"
  NPATCH_VERSION: "v1.0.6"
  NPATCH_JAR_NAME: "jar-v1.0.6-698-release.jar"
  NPATCH_SHA256: "9e9ba3a2bbfee120940b20bb6950f85b872627d921da8e13f664158b4d5ca5fc"
  ORIGINAL_APK: "origin/racingdaily.apk"

jobs:
  build-integrated:
    name: Build integrated NPatch APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false

      - name: Set up JDK 17 for Android build
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          gradle-version: "8.4"

      - name: Validate original APK
        run: |
          set -euo pipefail
          mkdir -p build
          test -s "${ORIGINAL_APK}"
          if head -c 64 "${ORIGINAL_APK}" | grep -q "git-lfs.github.com/spec"; then
            echo "Original APK is still a Git LFS pointer" >&2
            exit 1
          fi
          unzip -tqq "${ORIGINAL_APK}"
          unzip -l "${ORIGINAL_APK}" AndroidManifest.xml | grep -q AndroidManifest.xml
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2" dump badging "${ORIGINAL_APK}" > build/original.badging
          cat build/original.badging | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"

      - name: Build Xposed module
        run: gradle --no-daemon clean test lint assembleRelease --stacktrace

      - name: Decode and validate signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          mkdir -p build/signing
          printf "%s" "${KEYSTORE_BASE64}" | base64 --decode > build/signing/release.keystore
          test -s build/signing/release.keystore
          keytool -list \
            -keystore build/signing/release.keystore \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" >/dev/null

      - name: Sign Xposed module APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"
          mapfile -t module_apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk")
          test "${#module_apks[@]}" -eq 1
          mkdir -p build/module
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign" \
            -P 16 -f -v 4 "${module_apks[0]}" build/module/module-aligned.apk
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
            --ks build/signing/release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out build/module/xposed-module-signed.apk \
            build/module/module-aligned.apk
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify \
            --verbose --print-certs build/module/xposed-module-signed.apk

      - name: Download and verify NPatch
        run: |
          set -euo pipefail
          mkdir -p tools
          curl --fail --location --retry 3 --retry-all-errors \
            --output tools/npatch.jar \
            "https://github.com/7723mod/NPatch/releases/download/${NPATCH_VERSION}/${NPATCH_JAR_NAME}"
          echo "${NPATCH_SHA256}  tools/npatch.jar" | sha256sum --check --strict

      - name: Set up JDK 21 for NPatch
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Prepare BKS keystore for NPatch
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          provider_args=(
            -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider
            -providerpath tools/npatch.jar
          )

          if keytool -list -storetype BKS "${provider_args[@]}" \
            -keystore build/signing/release.keystore \
            -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" >/dev/null 2>&1; then
            cp build/signing/release.keystore build/signing/release-final.keystore
          else
            source_type=""
            for candidate in PKCS12 JKS; do
              if keytool -list -storetype "${candidate}" \
                -keystore build/signing/release.keystore \
                -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" >/dev/null 2>&1; then
                source_type="${candidate}"
                break
              fi
            done
            test -n "${source_type}"
            keytool -importkeystore -noprompt \
              -srckeystore build/signing/release.keystore \
              -srcstoretype "${source_type}" \
              -srcstorepass "${KEYSTORE_PASSWORD}" \
              -srcalias "${KEY_ALIAS}" \
              -srckeypass "${KEY_PASSWORD}" \
              -destkeystore build/signing/release-final.keystore \
              -deststoretype BKS \
              -deststorepass "${KEYSTORE_PASSWORD}" \
              -destalias "${KEY_ALIAS}" \
              -destkeypass "${KEY_PASSWORD}" \
              "${provider_args[@]}"
          fi

          keytool -list -storetype BKS "${provider_args[@]}" \
            -keystore build/signing/release-final.keystore \
            -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" >/dev/null
          keytool -exportcert -storetype BKS "${provider_args[@]}" \
            -keystore build/signing/release-final.keystore \
            -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" \
            -file build/signing/release-cert.der

          security_file="${JAVA_HOME}/conf/security/java.security"
          last_provider="$(sed -n 's/^security\.provider\.\([0-9][0-9]*\)=.*/\1/p' "${security_file}" | sort -n | tail -n 1)"
          test -n "${last_provider}"
          printf 'security.provider.%s=org.bouncycastle.jce.provider.BouncyCastleProvider\n' \
            "$((last_provider + 1))" > build/signing/npatch-security.properties

      - name: Inject module with NPatch integrated mode
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/npatch-output build/final
          java -Djava.security.properties=build/signing/npatch-security.properties \
            -jar tools/npatch.jar \
            "${ORIGINAL_APK}" \
            --embed build/module/xposed-module-signed.apk \
            --output build/npatch-output \
            --keystore build/signing/release-final.keystore "${KEYSTORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}" \
            --sigbypasslv 2 \
            --verbose

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import sys
          import zipfile

          candidates = []
          module_path = Path("build/module/xposed-module-signed.apk")
          module_digest = hashlib.sha256(module_path.read_bytes()).digest()
          embedded_module = "assets/npatch/modules/com.fxxkad.dailyracing.apk"
          for apk in Path("build/npatch-output").rglob("*.apk"):
              try:
                  with zipfile.ZipFile(apk) as archive:
                      names = set(archive.namelist())
                      if (
                          "AndroidManifest.xml" in names
                          and embedded_module in names
                          and archive.read("AndroidManifest.xml")
                          and hashlib.sha256(archive.read(embedded_module)).digest() == module_digest
                      ):
                          candidates.append(apk)
              except (KeyError, zipfile.BadZipFile):
                  continue

          if not candidates:
              raise SystemExit("NPatch did not produce a valid APK containing AndroidManifest.xml")

          selected = max(candidates, key=lambda path: path.stat().st_size)
          print(f"Selected NPatch output: {selected} ({selected.stat().st_size} bytes)")
          shutil.copyfile(selected, "build/final/racingdaily-npatched.apk")
          PY

      - name: Verify final APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="build/final/racingdaily-npatched.apk"
          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign"

          test -s "${APK}"
          if "${ZIPALIGN}" -c -P 16 -v 4 "${APK}" > build/final/zipalign-16k.txt 2>&1; then
            echo "Final APK is 16 KB ZIP-aligned"
          else
            echo "Final APK uses Android 16's 4 KB page-size compatibility mode"
            "${ZIPALIGN}" -c -P 4 -v 4 "${APK}" > build/final/zipalign-4k.txt 2>&1
            tail -n 1 build/final/zipalign-4k.txt
          fi
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee build/final/signature.txt

          expected_cert="$(sha256sum build/signing/release-cert.der | cut -d' ' -f1)"
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/final/signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]')"
          test -n "${actual_cert}"
          test "${expected_cert}" = "${actual_cert}"

          "${AAPT2}" dump badging "${APK}" > build/final/patched.badging
          read_meta() {
            sed -n -e "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/package=\1 versionCode=\2 versionName=\3/p" \
              -e "s/^sdkVersion:'\([^']*\)'.*/minSdk=\1/p" \
              -e "s/^targetSdkVersion:'\([^']*\)'.*/targetSdk=\1/p" "$1"
          }
          read_meta build/original.badging > build/final/original.meta
          read_meta build/final/patched.badging > build/final/patched.meta
          cat build/final/original.meta
          diff --strip-trailing-cr build/final/original.meta build/final/patched.meta

      - name: Prepare artifact names
        id: artifacts
        run: |
          set -euo pipefail
          version_name="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" build/original.badging)"
          module_version="$("${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2" dump badging build/module/xposed-module-signed.apk \
            | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          build_time="$(date -u +%Y%m%d-%H%M%SZ)"
          integrated_name="racingdaily-${version_name}-npatch-${NPATCH_VERSION}-${build_time}.apk"
          module_name="fxxkad-dailyracing-${module_version}-${build_time}.apk"
          cp build/final/racingdaily-npatched.apk "build/final/${integrated_name}"
          cp build/module/xposed-module-signed.apk "build/module/${module_name}"
          echo "integrated_name=${integrated_name}" >> "${GITHUB_OUTPUT}"
          echo "module_name=${module_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload integrated APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifacts.outputs.integrated_name }}
          path: build/final/${{ steps.artifacts.outputs.integrated_name }}
          if-no-files-found: error

      - name: Upload Xposed module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifacts.outputs.module_name }}
          path: build/module/${{ steps.artifacts.outputs.module_name }}
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          if [[ -d build/signing ]]; then
            find build/signing -type f -delete
          fi
